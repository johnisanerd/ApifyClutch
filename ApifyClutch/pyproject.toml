[project]
name = "ApifyClutch"
version = "1.0.0"
description = "Apify Actor that collects structured records from a web data source."
requires-python = ">=3.13"
dependencies = [
    "apify>=4.0,<5",
    "apify-free-tier",
    "curl-cffi>=0.7,<1",
    "email-enrich",
    "python-dotenv>=1.0,<2",
]

[tool.uv]
package = false

# apify-free-tier is a public tarball (no git in the image). email-enrich is a
# private git tag. The Dockerfile builder stage injects GH_EMAIL_ENRICH_TOKEN
# via git insteadOf so the token never lands in this file or uv.lock.
[tool.uv.sources]
apify-free-tier = { url = "https://github.com/johnisanerd/Apify-Free-Tier-Limiter/archive/refs/tags/v0.1.8.tar.gz" }
email-enrich = { git = "https://github.com/johnisanerd/Apify-Email-Enrich-Module.git", tag = "v0.1.2" }
